<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travira — Reset password</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #0B1D2A, #0D47A1, #1565C0, #42A5F5);
      display: flex; align-items: center; justify-content: center; padding: 24px;
      color: #0D1B2A;
    }
    .card {
      width: 100%; max-width: 420px; background: rgba(255,255,255,0.92);
      border-radius: 24px; padding: 28px 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.6);
    }
    h1 { margin: 0 0 6px; color: #1565C0; font-size: 1.5rem; }
    p.sub { margin: 0 0 20px; color: #546E7A; font-size: 0.9rem; line-height: 1.45; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin: 12px 0 6px; color: #37474F; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #B0BEC5;
      font-size: 1rem; outline: none;
    }
    input:focus { border-color: #1565C0; box-shadow: 0 0 0 3px rgba(21,101,192,0.2); }
    button {
      width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 14px;
      background: #1565C0; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 14px; padding: 12px; border-radius: 12px; font-size: 0.9rem; display: none; }
    .msg.ok { display: block; background: #E8F5E9; color: #2E7D32; }
    .msg.err { display: block; background: #FFEBEE; color: #C62828; }
    .hint { margin-top: 10px; font-size: 0.8rem; color: #78909C; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset password</h1>
    <p class="sub">Choose a new password for your Travira account. This will sign you out on every other device.</p>
    <form id="form">
      <label for="password">New password (min 6 characters)</label>
      <input id="password" type="password" minlength="6" required autocomplete="new-password" />
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" minlength="6" required autocomplete="new-password" />
      <button type="submit" id="btn">Update password</button>
    </form>
    <div id="msg" class="msg"></div>
    <p class="hint" id="hint">Open this page from the link in your email. The link expires in 1 hour.</p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";
    const msg = document.getElementById("msg");
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const hint = document.getElementById("hint");

    if (!token) {
      msg.className = "msg err";
      msg.textContent = "Missing reset token. Open the link from your email again.";
      form.style.display = "none";
      hint.textContent = "Request a new link from the Travira app (Forgot password).";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm").value;
      if (password !== confirmPassword) {
        msg.className = "msg err";
        msg.textContent = "Passwords do not match.";
        return;
      }
      if (password.length < 6) {
        msg.className = "msg err";
        msg.textContent = "Password must be at least 6 characters.";
        return;
      }
      btn.disabled = true;
      msg.className = "msg";
      msg.textContent = "";
      try {
        const res = await fetch("/api/users/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password, confirmPassword })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.success === false) {
          msg.className = "msg err";
          msg.textContent = data.message || "Could not reset password.";
        } else {
          msg.className = "msg ok";
          msg.textContent =
            (data.message || "Password updated.") +
            " All other devices were signed out. Open the Travira app and log in with your new password.";
          form.style.display = "none";
          hint.textContent = "You can close this page.";
        }
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "Network error. Try again.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
